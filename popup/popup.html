<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamScore Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 class="logo">StreamScore</h1>
      <p class="tagline">Ratings for Streaming</p>
    </div>

    <div class="content">
      <!-- API Key Section -->
      <div class="section">
        <label for="apiKey" class="label">OMDb API Key</label>
        <div class="input-group">
          <input 
            type="text" 
            id="apiKey" 
            class="input" 
            placeholder="Enter your API key"
            autocomplete="off"
          />
          <div class="status-indicator" id="statusIndicator">
            <span class="status-dot"></span>
          </div>
        </div>
        <p class="help-text">
          Don't have an API key? 
          <a href="https://www.omdbapi.com/apikey.aspx" target="_blank" rel="noopener" class="link">
            Get one free here
          </a> (1,000 requests/day)
        </p>
      </div>

      <!-- Save Button -->
      <button id="saveBtn" class="btn btn-primary">
        <span id="saveText">Save Settings</span>
        <span id="saveLoader" class="loader" style="display: none;"></span>
      </button>

      <!-- Status Message -->
      <div id="statusMessage" class="status-message" style="display: none;"></div>

      <!-- Supported Platforms -->
      <div class="section platforms">
        <h3 class="section-title">Supported Platforms</h3>
        <ul class="platform-list">
          <li class="platform-item">
            <span class="platform-icon">📺</span>
            <span class="platform-name">Netflix</span>
          </li>
          <li class="platform-item">
            <span class="platform-icon">✨</span>
            <span class="platform-name">Disney+</span>
          </li>
          <li class="platform-item">
            <span class="platform-icon">🍎</span>
            <span class="platform-name">Apple TV+</span>
          </li>
          <li class="platform-item">
            <span class="platform-icon">📦</span>
            <span class="platform-name">Prime Video</span>
          </li>
        </ul>
      </div>

      <!-- Footer -->
      <div class="footer">
        <p class="version">Version 1.0.0</p>
        <p class="privacy">No data is collected or shared</p>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
